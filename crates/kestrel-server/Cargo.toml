[package]
name = "kestrel-server"
description = "Kestrel monitoring server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
data-encoding = "2"
figment = { version = "0.10", features = ["toml", "env"] }
getrandom = "0.2"
http = "1"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
time = { version = "0.3", features = ["formatting", "parsing", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = "0.16"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
kestrel-agent = { path = "../kestrel-agent" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
