name: SNMP UPS-MIB
description: UPS status from UPS-MIB
items:
  - key: snmp.upsBatteryStatus
    kind: snmp
    interval_s: 30
    params:
      oid: 1.3.6.1.2.1.33.1.2.1.0
  - key: snmp.upsOutput
    kind: snmp
    interval_s: 60
    params:
      oid: 1.3.6.1.2.1.33.1.4
      walk: true
triggers:
  - name: UPS is on battery
    expression: snmp_ups_battery_status == 3
    severity: high
    for_seconds: 60
