[package]
name = "kestrel-checks"
description = "Built-in collectors and check runners for the Kestrel agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kestrel-proto = { path = "../kestrel-proto" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
# Default features include the async-io runtime the blocking proxy sits on.
# zbus 4 refuses to compile without async-io or tokio.
zbus = "4.4"
