[package]
name = "kestrel-checks"
description = "Built-in collectors and check runners for the Kestrel agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kestrel-proto = { path = "../kestrel-proto" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "time"] }
tokio-rustls = "0.26"
x509-parser = "0.16"

[dev-dependencies]
rcgen = { version = "0.13", features = ["pem"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
# Default features include the async-io runtime the blocking proxy sits on.
# zbus 4 refuses to compile without async-io or tokio.
zbus = "4.4"
