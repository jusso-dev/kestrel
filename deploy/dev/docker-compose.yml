# Local development stack. The database password is the dev default only.
# Do not reuse this file as a production deployment.

services:
  server:
    profiles: ["server"]
    build:
      context: ../..
      dockerfile: Dockerfile.server
    command: ["--config", "/etc/kestrel/server.toml"]
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - kestrel-server:/var/lib/kestrel
      - ./server-container.toml:/etc/kestrel/server.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      victoria:
        condition: service_started
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
      POSTGRES_DB: kestrel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kestrel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel -d kestrel"]
      interval: 5s
      timeout: 5s
      retries: 12

  victoria:
    image: victoriametrics/victoria-metrics:latest
    command:
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - kestrel-metrics:/victoria-metrics-data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Optional lab SNMP simulator. Not started by default.
  snmpsim:
    image: tandrup/snmpsim:latest
    profiles: ["snmp"]
    ports:
      - "127.0.0.1:1161:1161/udp"

  # Optional local OTLP receiver. Kestrel's own /v1/metrics endpoint does not
  # need this process; it is here for manual comparison.
  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    profiles: ["otel"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"

volumes:
  kestrel-pg:
  kestrel-server:
  kestrel-metrics:
