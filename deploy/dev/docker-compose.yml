# Local development stack. The database password is the dev default only.
# Do not reuse this file as a production deployment.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
      POSTGRES_DB: kestrel
    ports:
      - "5432:5432"
    volumes:
      - kestrel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel -d kestrel"]
      interval: 5s
      timeout: 5s
      retries: 12

  victoria:
    image: victoriametrics/victoria-metrics:latest
    command:
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
    ports:
      - "8428:8428"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional lab SNMP simulator. Not started by default.
  snmpsim:
    image: tandrup/snmpsim:latest
    profiles: ["snmp"]
    ports:
      - "1161:1161/udp"

  # Optional local OTLP receiver. Kestrel's own /v1/metrics endpoint does not
  # need this process; it is here for manual comparison.
  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    profiles: ["otel"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"

volumes:
  kestrel-pg:
